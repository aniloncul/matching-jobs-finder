<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1d1d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>JobScout — Agent Control Room</title>
    <style>
      html,
      body {
        background: #ffffff;
      }
    </style>
    <script>
      // Apply the stored theme before the first paint so the page never
      // flashes the wrong background. The app keeps this in sync afterwards.
      (function () {
        var theme = "light";
        try {
          var stored = window.localStorage.getItem("jobscout-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (error) {
          theme = "light";
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.background = theme === "dark" ? "#1d1d1d" : "#ffffff";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
