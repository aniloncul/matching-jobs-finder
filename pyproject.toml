[project]
name = "jobscout"
version = "0.1.0"
description = "Agentic LinkedIn + Indeed job search with a live blueprint UI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.9.0",
  "PyYAML>=6.0.2",
  "Jinja2>=3.1.4",
  "httpx>=0.27.2",
  "beautifulsoup4>=4.12.3",
  "python-dotenv>=1.0.1",
  "gspread>=6.1.4",
  "google-auth>=2.35.0",
  "playwright>=1.49.0",
  "openpyxl>=3.1.5",
  "python-multipart>=0.0.32",
  "pypdfium2>=5.14.0",
  "pillow>=13.0.0",
  "numpy>=1.26.0",
  "rank-bm25>=0.2.2",
  "pytesseract>=0.3.10",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
